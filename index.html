
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeCard Network | School POS & Fintech</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      #initial-loader {
        display: flex; position: fixed; inset: 0; align-items: center; justify-content: center;
        background: #ffffff; z-index: 9999; transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
  <body>
    <div id="initial-loader">
      <div class="flex flex-col items-center gap-6">
        <div style="width: 48px; height: 48px; border: 3px solid #f1f5f9; border-top: 3px solid #6366f1; border-radius: 50%; animation: spin 0.7s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite;"></div>
        <p style="font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 4px; color: #94a3b8; margin-top: 8px;">MeCard Network</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('initial-loader');
        if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 600); }
      });
    </script>
  </body>
</html>
